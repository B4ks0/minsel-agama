{% extends 'main/base.html' %}
{% block title %}Hapus Gereja - Kemenag Minsel{% endblock %}
{% block page_title %}Hapus Gereja{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-danger">
      <div class="card-body text-center py-4">
        <div class="display-4 text-danger mb-3"><i class="bi bi-exclamation-triangle"></i></div>
        <h5>Konfirmasi Hapus</h5>
        <p class="text-muted">Apakah Anda yakin ingin menghapus data gereja <strong>{{ nama }}</strong>?</p>
        <form method="post" class="d-flex justify-content-center gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Ya, Hapus</button>
          <a href="{% url 'gereja_list' %}" class="btn btn-outline-secondary">Batal</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
